name: thinkaloudai

# =============================================================================
# ThinkAloudAI full stack:
#   nginx (frontend) -> FastAPI (backend) -> PostgreSQL + Redis
#
# The frontend is built with VITE_API_URL=/ so all API calls are same-origin
# and nginx reverse-proxies them to the backend. No CORS configuration needed.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-thinkaloud_monolith}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-thinkaloud_monolith}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Container networking always wins over values in backend/.env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-thinkaloud_monolith}
      REDIS_URL: redis://redis:6379/0
      # Disable any RDS_* values copied from an existing backend/.env so the
      # bundled PostgreSQL container is used instead.
      RDS_HOST: ""
      RDS_DB_NAME: ""
      PORT: 8000
    # The image defaults to 4 workers; 1 keeps small EC2 instances (t3.small) healthy.
    command:
      - sh
      - -c
      - uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1} --proxy-headers --forwarded-allow-ips=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # "/" means same-origin: the app calls /api/v1/... on the current host
        VITE_API_URL: /
        VITE_ADMIN_EMAILS: ${VITE_ADMIN_EMAILS:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Optional LiveKit voice agent worker.
  # Start it with:  docker compose --profile voice up -d --build
  # Requires LIVEKIT_* and AI provider keys in backend/.env.
  # ---------------------------------------------------------------------------
  voice-worker:
    profiles: ["voice"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.voice_agent.worker", "start"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-thinkaloud_monolith}
      REDIS_URL: redis://redis:6379/0
      RDS_HOST: ""
      RDS_DB_NAME: ""
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
