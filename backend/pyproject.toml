[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkaloudai-monolith"
version = "1.0.0"
description = "ThinkAloudAI Unified Monolith Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "resend>=2.0.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "greenlet>=3.0.0",
    "structlog>=24.1.0",
    "livekit-api>=1.1.0",
    "openai>=1.40.0",
    "langgraph>=1.2.4",
    "sarvamai>=0.1.30",
    "livekit-agents>=1.4.2",
    "livekit-plugins-cartesia>=1.4.2",
    "livekit-plugins-silero>=1.4.2",
    "livekit-plugins-speechmatics>=1.4.2",
    "livekit-plugins-deepgram>=1.4.2",
    "livekit-plugins-openai>=1.4.2",
    "langsmith>=0.1.0",
    "websockets>=12.0",
    "langchain>=0.2.0",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "tavily-python>=0.8.4",
    "e2b-code-interpreter>=2.10.1",
    "ddtrace>=4.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["alembic/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
