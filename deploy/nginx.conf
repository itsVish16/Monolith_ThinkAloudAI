# =============================================================================
# ThinkAloudAI Nginx Configuration
# Serves React/Vite SPA and reverse-proxies FastAPI Monolith & WebSockets
# Place at: /etc/nginx/sites-available/thinkaloud
# Symlink to: /etc/nginx/sites-enabled/thinkaloud
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your domain name (e.g. thinkaloudai.tech) or leave _ for IP

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # -------------------------------------------------------------------------
    # Frontend Single Page Application (Static Build)
    # -------------------------------------------------------------------------
    root /var/www/thinkaloud/frontend/dist;
    index index.html;

    # Static Vite assets with immutable long-term caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA routing fallback: send all non-asset requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # Backend Monolith API Reverse Proxy (FastAPI + Uvicorn)
    # -------------------------------------------------------------------------
    location ~ ^/(api|docs|redoc|openapi.json|health) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Proxy forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for streaming LLM responses & long connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
