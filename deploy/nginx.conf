# =============================================================================
# ThinkAloudAI Nginx API Gateway Configuration (EC2 Backend)
# Reverse-proxies FastAPI Monolith & WebSockets to Uvicorn (Port 8000)
# (Frontend is hosted on Vercel)
# Place at: /etc/nginx/sites-available/thinkaloud
# Symlink to: /etc/nginx/sites-enabled/thinkaloud
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your API domain (e.g. api.thinkaloudai.tech) or leave _

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # -------------------------------------------------------------------------
    # Reverse Proxy to FastAPI Monolith (Uvicorn on Port 8000)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for streaming LLM responses & long connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
